<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Railway Route Optimization System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Smart Railway Route Optimization System</h1>
    <p>Using Graph Algorithms (BFS and Dijkstra)</p>
  </header>

  <main>
    <div class="card">
      <h2>Find a route</h2>
      <div class="controls">
        <label for="startSelect">From</label>
        <select id="startSelect"></select>
        <label for="endSelect">To</label>
        <select id="endSelect"></select>
        <button id="findBtn">Find route</button>
      </div>
      <div id="routeOutput">
        <p>Choose two stations and press the button.</p>
      </div>
    </div>

    <div class="card">
      <details>
        <summary>Show graph data (stations and neighbours, unverified)</summary>
        <pre id="graphOutput">Loading...</pre>
      </details>
    </div>
  </main>

  <script src="js/graph.js"></script>
  <script src="js/algorithms.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
